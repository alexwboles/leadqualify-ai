<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeadQualify — Lead inbox</title>
<style>
  :root{
    --accent:#7c3aed; --accent-dark:#6d28d9; --accent-soft:rgba(124,58,237,.08);
    --bg:#f8f9fb; --card:#fff; --line:#e5e8ec; --divider:#eef0f3; --ink:#101828; --muted:#667085;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{font-family:var(--font);margin:0;background:var(--bg);color:var(--ink);
    font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
  header{background:#fff;border-bottom:1px solid var(--line);padding:10px 24px;
    display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:10}
  .brand{font-weight:700;font-size:17px;letter-spacing:-.01em}
  header nav{display:flex;align-items:center;gap:16px}
  header nav a.navlink{color:var(--muted);text-decoration:none;font-size:14px;font-weight:500}
  header nav a.navlink:hover{color:var(--ink)}
  #export{background:var(--accent);color:#fff;text-decoration:none;font-size:14px;font-weight:600;
    border-radius:9px;padding:10px 18px;min-height:42px;display:inline-flex;align-items:center;font-family:var(--font)}
  #export:hover{background:var(--accent-dark)}
  #export:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .wrap{max-width:1120px;margin:0 auto;padding:24px}
  .toolbar{display:flex;gap:4px;align-items:center;margin-bottom:20px;flex-wrap:wrap}
  .chip{border:none;background:none;color:var(--muted);font-family:var(--font);
    border-radius:6px 6px 0 0;padding:10px 14px;min-height:40px;cursor:pointer;
    font-size:14px;font-weight:500;border-bottom:2px solid transparent}
  .chip:hover{color:var(--ink);background:#f2f4f7}
  .chip.active{color:var(--accent-dark);border-bottom-color:var(--accent);font-weight:600}
  .chip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lead{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:20px;margin-bottom:14px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .lead-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .lead-name{font-size:16px;font-weight:600}
  .badge{font-size:11px;font-weight:700;border-radius:999px;padding:4px 12px;
    text-transform:uppercase;letter-spacing:.05em;margin-left:8px;vertical-align:middle}
  .hot{background:#fee2e2;color:#b91c1c}.warm{background:#fef3c7;color:#b45309}.cold{background:#e0e7ff;color:#3730a3}
  .score{color:var(--muted);font-size:14px}
  .meta{color:var(--muted);font-size:13px;margin-top:8px}
  .meta strong{color:var(--ink);font-weight:600}
  .reasons{margin:12px 0 0;padding-left:18px;font-size:14px;color:#344054}
  .reasons li{margin-bottom:4px}
  .empty{text-align:center;color:var(--muted);padding:64px 20px;background:var(--card);
    border:1px solid var(--line);border-radius:12px}
  .empty a{color:var(--accent-dark);font-weight:500}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin-bottom:20px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;box-shadow:0 1px 2px rgba(16,24,40,.06)}
  .stat b{font-size:26px;font-weight:700;display:block;letter-spacing:-.01em}
  .stat span{font-size:13px;color:var(--muted)}
  h2{font-size:21px;font-weight:600;margin:24px 0 12px}
  @media (max-width:640px){
    .wrap{padding:16px}
    header{padding:10px 16px;flex-wrap:wrap;gap:8px}
    .lead-head{flex-direction:column;align-items:flex-start}
    .toolbar{gap:0;overflow-x:auto;flex-wrap:nowrap}
    .chip{white-space:nowrap}
  }
</style>
</head>
<body>
<header>
  <span class="brand">LeadQualify inbox</span>
  <nav><a class="navlink" href="/demo/">Demo site</a><a href="#" id="export">Export CSV</a></nav>
</header>
<div class="wrap">
  <div class="stats" id="stats"></div>
  <div class="toolbar" id="filters">
    <button class="chip active" data-f="all">All</button>
    <button class="chip" data-f="hot">Hot</button>
    <button class="chip" data-f="warm">Warm</button>
    <button class="chip" data-f="cold">Cold</button>
  </div>
  <div id="list"></div>
</div>
<script>
var filter = "all", leads = [];

function loadLeads(cb) {
  fetch("/api/leads").then(function (r) { return r.json(); }).then(function (data) {
    leads = data; cb();
  }).catch(function () {
    try { leads = JSON.parse(localStorage.getItem("lq_leads") || "[]"); } catch (e) { leads = []; }
    cb();
  });
}

function badge(t) { return '<span class="badge ' + t + '">' + t + '</span>'; }

function render() {
  var stats = { hot: 0, warm: 0, cold: 0 };
  leads.forEach(function (l) { if (stats[l.tier] !== undefined) stats[l.tier]++; });
  document.getElementById("stats").innerHTML =
    stat(leads.length, "total leads") + stat(stats.hot, "hot") +
    stat(stats.warm, "warm") + stat(stats.cold, "cold");
  var list = document.getElementById("list");
  var shown = leads.filter(function (l) { return filter === "all" || l.tier === filter; });
  if (!shown.length) {
    list.innerHTML = '<div class="empty">No leads yet. <a href="/demo/">Open the demo site</a> and chat with the widget — after-hours leads land here automatically.</div>';
    return;
  }
  list.innerHTML = shown.slice().reverse().map(function (l) {
    var a = l.answers || {};
    return '<div class="lead"><div class="lead-head"><div><span class="lead-name">' + esc(a.name || "Unknown") +
      '</span>' + badge(l.tier || "cold") + ' <span class="score">(' + (l.score || 0) + '/100)</span></div>' +
      '<div class="meta">' + esc(l.createdAt || "") + (l.afterHours ? " · after hours" : "") + '</div></div>' +
      '<div class="meta"><strong>Service:</strong> ' + esc(a.service || "—") +
      ' · <strong>Timeline:</strong> ' + esc(a.timeline || "—") +
      ' · <strong>Budget:</strong> ' + esc(a.budget || "—") +
      ' · <strong>Location:</strong> ' + esc(a.location || "—") +
      ' · <strong>Contact:</strong> ' + esc(a.contact || "—") + '</div>' +
      '<ul class="reasons">' + (l.reasons || []).map(function (r) { return "<li>" + esc(r) + "</li>"; }).join("") + '</ul></div>';
  }).join("");
}
function stat(n, label) { return '<div class="stat"><b>' + n + '</b><span>' + label + '</span></div>'; }
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

document.getElementById("filters").addEventListener("click", function (e) {
  if (e.target.dataset.f) {
    filter = e.target.dataset.f;
    var chips = this.querySelectorAll(".chip");
    for (var i = 0; i < chips.length; i++) chips[i].classList.remove("active");
    e.target.classList.add("active");
    render();
  }
});
document.getElementById("export").onclick = function (e) {
  e.preventDefault();
  window.location = "/api/export.csv";
  return false;
};

loadLeads(render);
setInterval(function () { loadLeads(render); }, 15000); // live refresh
</script>
</body>
</html>
